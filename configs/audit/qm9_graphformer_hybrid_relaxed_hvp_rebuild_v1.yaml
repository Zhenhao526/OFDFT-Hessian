analytic_response:
  definition: >-
    Optimize the center density strictly, solve G_y y_v=-G_R v for the
    constrained KKT tangent, and evaluate H_relaxed v=L_RR v+L_Ry y_v.
    Parameter gradients use an implicit adjoint solve.
  forbidden_fallbacks: [fixed_density, stale_density, detached_hvp]
  density_projected_gradient_threshold: 1.0e-8
  integral_directional_second_step_bohr: 1.0e-4
  response_tolerance: 1.0e-10
  response_max_iterations: 2500
  response_damping: 1.0e-8
  solvers_to_compare: [direct, pcg, minres, deflated_pcg]
  solver_selection: fastest_method_meeting_strict_residual_and_hvp_accuracy
  density_response_prediction_correction: true

numerics:
  dtype: float64
  displacement_bohr: 1.0e-3
  integral_derivative_step_bohr: 1.0e-4
  integral_directional_second_step_bohr: 1.0e-4
  density:
    initialization: label_reference
    stage1_adam_lr: 1.0e-3
    stage1_max_cycles: 1000
    stage1_threshold: 1.0e-2
    fallback_adam_lr: 3.0e-4
    fallback_max_cycles: 10000
    fallback_threshold: 1.0e-5
    lbfgs_refine: true
    newton_refine: true
    strict_projected_gradient_threshold: 1.0e-8
  analytic_geometry_response:
    required: true
    solver: select_fastest_strict_from_registered_benchmark
    damping: 0.0
    residual_tolerance: 1.0e-10
    displaced_density_optimization_allowed_for_audit_only: true
    displaced_density_response_initialization: c0_plus_or_minus_h_cv
  implicit_parameter_response:
    required: true
    tolerance: 3.0e-5
    max_iterations: 2500
    damping: 1.0e-8
    diagonal_probes: 0
    warm_start: true
    failure_action: raise_without_fallback

