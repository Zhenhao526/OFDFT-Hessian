definitions:
  scalar_owner: >-
    E_total(R,c;theta)=E_Graphformer_kin_plus_xc(R,c;theta)+E_H(R,c)
    +E_ext(R,c)+E_nn(R).
  total_relaxed_force: >-
    F_theta(R)=-d E_total(R,c_star(R;theta);theta)/dR from the constrained
    scalar Lagrangian at a density with projected gradient below 1e-8.
  complete_total_relaxed_hvp: >-
    H_theta v=L_RR v+L_Ry y_v, where G_y y_v=-G_R v is solved at the
    strictly converged center density. PySCF integral second-directional
    terms are central differences of complete first-derivative bundles.
  parameter_backward: >-
    Density/KKT response and parameter backward use implicit tangent and
    adjoint solves; fixed-density, stale-density and detached fallbacks are forbidden.
  stochastic_training_loss: >-
    One fresh Rademacher probe in the complete orthonormal 3N-6 internal
    basis gives an unbiased internal Hessian Frobenius-squared estimator.

