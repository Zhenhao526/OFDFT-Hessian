definitions:
  scalar_owner: >-
    E_total(R,c;theta)=E_Graphformer_kin_plus_xc(R,c;theta)+E_H(R,c)
    +E_ext(R,c)+E_nn(R).
  egf_replay: >-
    E, projected G, and scalar-derived F are evaluated at the frozen PBE/KS
    label density. The complete-total projected G target is zero, which is
    equivalent to matching the Structures25 kin_plus_xc density derivative
    after adding the known classical derivative.
  implicit_hvp: >-
    H_relaxed v=E_RR v-E_Rc E_cc^-1 E_cR v at the strictly converged
    model-self-consistent center density. One fresh unnormalized Rademacher
    probe is sampled in the complete orthonormal 3N-6 internal basis.
  forbidden_fallbacks:
    - fixed_density_hvp
    - displaced_ks_density_hvp
    - stale_model_density
    - detached_hvp
    - independent_force_head
    - independent_hessian_head

