    estimator: unbiased_internal_hessian_frobenius_squared
  remove_translation_rotation: true
  complete_basis_required: true

numerics:
  dtype: float64
  integral_derivative_step_bohr: 1.0e-4
  integral_directional_second_step_bohr: 1.0e-4
  density:
    initialization: label_reference
    stage1_adam_lr: 1.0e-3
    stage1_max_cycles: 1000
    stage1_threshold: 1.0e-2
    fallback_adam_lr: 3.0e-4
    fallback_max_cycles: 10000
