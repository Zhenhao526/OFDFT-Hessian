    - [E_MACE_theta(R0) - E_MACE_initial(R0)]
    - grad_R0[E_MACE_theta(R0) - E_MACE_initial(R0)] dot dR.
  correction: >-
    Shared MACE 0.3.16 higher-body equivariant scalar energy, loaded from an isolated
    vendor path; no force or Hessian head is used.
