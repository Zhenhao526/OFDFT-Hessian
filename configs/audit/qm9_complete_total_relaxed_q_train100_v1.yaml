protocol_id: qm9_complete_total_relaxed_q_train100_v1
frozen_at: 2026-07-23
stage: train100_existing_artifact_relaxed_scalar_curvature_eligibility
test100_access_allowed: false
test100_evaluations_used: 0

definition:
  scalar_owner: >-
    q(v) = v^T H v is evaluated from the same complete-total density-relaxed
    scalar energy and its scalar-derived force. It is a directional curvature,
    not a vector HVP and not an independent force or Hessian head.
  purpose: >-
    Identify directions whose scalar curvature is numerically stable even when
    orthogonal components of the vector finite-difference HVP are unstable.
  downstream_model: >-
    A density-independent Taylor-anchored scalar correction may consume only
    eligible q targets. Its value and force at the parent geometry must be
    exactly zero so train800 energy/force replay cannot be forgotten there.

