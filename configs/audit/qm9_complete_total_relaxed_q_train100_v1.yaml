numerical_gate:
  require_parent_density_branch_kkt_gate: true
  branches: [sad_continuation, label_continuation, sad_independent]
  small_steps_bohr: [3.0e-6, 1.0e-5, 3.0e-5]
  selected_force_secant_step_bohr: 1.0e-5
  scalar_energy_closure_step_bohr: 1.0e-3
  curvature_floor_hartree_per_bohr2: 0.1
  maximum_small_step_relative_spread: 0.05
  maximum_branch_relative_spread: 0.05
  maximum_implicit_relaxed_relative_difference: 0.05
  maximum_energy_force_relative_difference: 0.05
  maximum_direction_mismatch: 1.0e-10
  minimum_eligible_directions_per_parent: 3

decision:
  train100_q_ready_parent_count: 80
  rule: >-
    This audit may authorize only a q-supervision pilot when at least 80 of the
    frozen 100 parents pass with at least three directions. It cannot authorize
    Test100, cannot relabel q as HVP, and cannot waive later full-Hessian and
    unseen-parent validation.
