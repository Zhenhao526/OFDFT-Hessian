definitions:
  scalar_owner: >-
    E_total(R,c;theta)=E_Graphformer_kin_plus_xc(R,c;theta)+E_H(R,c)
    +E_ext(R,c)+E_nn(R).
  relaxed_hvp: >-
    H_theta v=L_RR v+L_Ry y_v with G_y y_v=-G_R v at a strictly
    converged center density.
  parameter_backward: >-
    Dense direct constrained KKT response and the registered implicit
    parameter adjoint connect every complete-total relaxed HVP to all
    Graphformer parameters.
  classical_energy_basis: physical
  symmetric_matrix_power_mode: eigh_second_order_audit
  forbidden_fallbacks: [fixed_density, stale_density, detached_hvp, force_head, hessian_head]

