cross_validation:
  fold_assignment: deterministic natoms/composition serpentine allocation
  feature_normalization: refit on the 16 training parents in every fold
  fit_labels: train-role HVP directions from the 16 training parents only
  held_parent_hvp_completion_allowed: false
  held_parent_fit_allowed: false
  held_metric: complete full PBE analytic Hessian
  ridge_grid: [1.0e-6, 1.0e-4, 1.0e-2, 1.0, 100.0]
  ridge_selection: >-
    Maximize held-parent fraction with relative Frobenius <=0.15, then minimize
    held-parent P90, then median, then prefer the larger ridge on an exact tie.

operator:
  source_hessian_spectral_polynomial_degree: 5
  source_hessian_spectral_rbf_centers: [-0.25, 0.0, 0.25, 0.5, 1.0, 2.0, 3.0, 4.5]
  source_hessian_spectral_rbf_width: 0.5
  equivariant_atom_block_basis: true
  scalar_definition: reference-anchored Cartesian quadratic
  energy_force_anchor_at_R0: exact
  force_head_allowed: false

preregistered_variants:
  - id: A_standard_conditioned_unbounded
    parent_feature_transform: standard
    parent_feature_transform_scale: 2.0
    block_parent_conditioning: true
    max_correction_to_source: .inf
  - id: B_tanh2_conditioned_unbounded
    parent_feature_transform: tanh
    parent_feature_transform_scale: 2.0
