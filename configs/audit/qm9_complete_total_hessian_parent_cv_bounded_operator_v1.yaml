advancement_gates:
  hessian_median_relative_frobenius_max: 0.10
  hessian_fraction_at_or_below_0_15_min: 0.80
  hessian_p90_relative_frobenius_max: 0.20
  asym_over_sym_frobenius_max: 0.005
  energy_force_change_from_source: exactly_zero_by_anchor
  frequency_mae_target_cm1: [100.0, 200.0]
  wrong_imaginary_modes: no_material_regression
  mode_overlap: improve_over_source

decision:
  passing_variant_required_before_external_validation: true
  if_none_pass: >-
    Do not read validation again and do not expand to train100. Replace the
    transferable scalar response representation rather than tuning the same folds.
  if_one_or_more_pass: >-
    Rank passing variants by P90, frequency MAE, imaginary-mode error, and mode
    overlap; freeze exactly one full-train coefficient set before external validation.
