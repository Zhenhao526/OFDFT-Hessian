definitions:
  scalar_owner: >-
    E_local(R) = E_A - F_A dot dR + 0.5 dR^T sym(H_A) dR
    + E_MACE_theta(R) - E_MACE_initial(R). Energy, force and Hessian are the
    zeroth, first and second geometry derivatives of this one scalar.
  training_curvature: >-
    H_correction v is trained as the centered secant of scalar-derived MACE
    correction forces at R +/- 1e-3 v. Full autograd Hessians are evaluation
    gates only, avoiding third geometry/parameter derivatives during fitting.
  gradient_intervention: >-
    Weighted E/F/HVP parameter gradients are divided by frozen v6n step-500
    median norms and deterministic PCGrad removes negative pairwise projections.
    Backtracking requires HVP decrease, keeps force nonincreasing until its
    registered physical budget, and allows energy to move only within its
    registered strict physical budget after that budget is reached.
  force: F = -d E_local / dR
  hessian: H = d2 E_local / dR2
  independent_force_head_allowed: false
  global_density_relaxed_functional_claim_allowed: false
  scope: one stable5 parent scalar-capacity mechanism test only
  isolated_dependency_path: /scratch/xzh/vendor/mace_torch_0_3_16

