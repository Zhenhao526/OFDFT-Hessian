definitions:
  scalar_owner: >-
    E_total(R,c;theta)=E_Graphformer_kin_plus_xc(R,c;theta)+E_H(R,c)
    +E_ext(R,c)+E_nn(R).
  total_relaxed_force: >-
    F_theta(R)=-d E_total(R,c_star(R;theta);theta)/dR from the constrained
    scalar Lagrangian at a strict stationary density.
  complete_total_relaxed_hvp: >-
    H_theta v=-(F_theta(R+h v)-F_theta(R-h v))/(2h), with each displaced
    density independently relaxed to the strict threshold and an implicit
    c_star parameter VJP attached to the training graph.
  independent_force_or_hessian_head_allowed: false
  proxy_or_silent_fallback_allowed: false
  detached_density_value_allowed_only_with_implicit_vjp: true

