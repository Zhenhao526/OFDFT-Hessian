    linear scalar readout over frozen MACE scalar and l>0 channel-Gram
    invariants plus fixed tanh random features.  E/F/H share this scalar.
  correction: >-
    The hash-bound stable5 h16 MACE step75 backbone is frozen. Intermediate
    l>0 channel Gram matrices are rotational invariants. Their fixed random
    tanh expansion uses input scale 1000 because the preregistered stable5
    feature RMS audit found raw power-feature RMS 5.7408e-4.
