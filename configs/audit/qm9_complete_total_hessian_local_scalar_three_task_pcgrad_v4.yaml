capacity_gate:
  training_median_relative_frobenius_max: 0.05
  training_all_parent_relative_frobenius_max: 0.05
  energy_median_ratio_to_source_max: 1.05
  force_median_ratio_to_source_max: 1.05
  antisymmetric_over_symmetric_frobenius_max: 0.005
  rule: >-
    Parent-CV remains forbidden until one formal arm passes every stable5 gate. Test100 and every
    parent outside frozen stable5 remain unread.

smoke_selection:
  eligibility: >-
    All scalar and gradient diagnostics must be finite; all three named task gradient norms must
    be positive at every positive logged step; final selection_score must be lower than the
    preregistered paired activation-v3 smoke score; and final median Hessian relative Frobenius
    must be lower than step zero.
  rank: >-
    Ascending final selection_score, then ascending final median Hessian relative Frobenius,
    then arm id.
  maximum_formal_arms: 1
  no_eligible_arm_action: >-
    Do not run another optimizer-weight scan. Audit full-batch/LBFGS optimization and the
    geometry-to-Hessian Jacobian rank on stable5 without opening a new parent.

