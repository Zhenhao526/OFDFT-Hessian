  Run only if local_scalar_activation_audit_v3 formal_analysis_v1 reports
  parent_cv_design_authorized=false.
test100_access_allowed: false
test100_evaluations_used: 0

definitions:
  scalar_owner: >-
    E_local(R) = E_A - F_A dot dR + 0.5 dR^T sym(H_A) dR
    + C_theta(R) - C_initial(R).
  source: strict complete-total relaxed original-A at sample_id=0
  force: F = -d E_local / dR
  hessian: H = d2 E_local / dR2
  independent_force_head_allowed: false
  scope: stable5 fit-only optimizer/Jacobian audit; not parent generalization
  changed_factor: >-
    Energy, force, and Hessian are three separately GradNorm-balanced PCGrad tasks instead of
    combining energy and force before the two-task projection. Architecture, initialization,
    targets, batches, warm-up, learning rate, and gates match activation audit v3.

