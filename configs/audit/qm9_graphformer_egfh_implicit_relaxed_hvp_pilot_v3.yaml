definitions:
  scalar_owner: >-
    E_total(R,c;theta)=E_Graphformer_kin_plus_xc(R,c;theta)+E_H(R,c)
    +E_ext(R,c)+E_nn(R).
  egf_replay: >-
    E, projected G, and scalar-derived F use the frozen PBE/KS label density.
  implicit_hvp: >-
    H_relaxed v=E_RR v-E_Rc E_cc^-1 E_cR v at the strictly converged
    model-self-consistent density, using one fresh unnormalized internal-space
    Rademacher probe per step and an implicit parameter adjoint.
  density_trust_region: >-
    The exact parameter-response density prediction is evaluated under the
    candidate new model. The AdamW step is backtracked by powers of two until
    every train-parent projected density gradient is below 5e-6. The trusted
    point enters LBFGS and Jacobi-preconditioned Newton-PCG first; the untouched
    legacy Adam chain remains a fail-closed fallback.
  optimizer: >-
    Independent AdamW states alternate H-only and E/G/F replay updates. HVP and
    replay learning rates, clipping, trust settings, and density-corrector
    settings are recorded independently.

