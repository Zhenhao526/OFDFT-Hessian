definitions:
  scalar_owner: >-
    E_total(R,c;theta)=E_Graphformer_kin_plus_xc(R,c;theta)+E_H(R,c)
    +E_ext(R,c)+E_nn(R).
  total_relaxed_force: >-
    F_theta(R)=-d E_total(R,c_star(R;theta);theta)/dR from the constrained
    scalar Lagrangian at a density with projected gradient below 1e-8.
  complete_total_relaxed_hvp: >-
    H_theta v=L_RR v+L_Ry y_v, where the center density is strictly converged,
    G_y y_v=-G_R v is solved without a detached/fixed-density fallback, and
    PySCF integral second-directional derivatives are central differences of
    complete first-derivative integral bundles. No displaced density is used.
  parameter_backward: >-
    The dense tangent solve uses an implicit adjoint. The stationary center
    density uses a constrained implicit parameter VJP.
  stochastic_training_loss: >-
    One fresh unnormalized Rademacher probe v=B^T z in the complete 3N-6
    orthonormal internal basis per step. Its squared HVP error is an unbiased
    estimator of the internal-space Hessian Frobenius-squared error.
  independent_force_or_hessian_head_allowed: false
  proxy_or_silent_fallback_allowed: false
  fixed_or_stale_density_hvp_allowed: false

