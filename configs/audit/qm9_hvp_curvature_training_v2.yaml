    - stable_only_strict_complete_total_hvp
    - representative_full_hessian_and_vibrations
  full_hessian_parent_count: [5, 10]
  energy_mae_relative_degradation_max: 0.05
  train700_energy_mae_relative_degradation_max: 0.05
  train700_force_mae_relative_degradation_max: 0.05
  train700_forgetting_gates_required_seeds: 3
