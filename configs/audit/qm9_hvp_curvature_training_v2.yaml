  majority_direction_wins_required: true
  full_hessian_and_vibrations_must_not_degrade: true
  test100_evaluations_before_candidate_freeze: 0
  test100_evaluations_after_candidate_freeze_max: 1

known_limitations:
  - The strict v2 all-four eligibility result remains mandatory sensitivity evidence.
  - D has one existing exact paired direction per parent rather than four.
  - E supervises a fixed-density learned-energy HVP with an implicit complete-total teacher target.
  - End-to-end differentiable implicit prediction is blocked by detached geometry integrals, density solve, and SciPy MINRES.
