selection:
  seed: 20260724
  atom_count_bins:
    - {name: small, minimum: 0, maximum: 15}
    - {name: medium, minimum: 16, maximum: 19}
    - {name: large, minimum: 20, maximum: 999}
  composition_definition: sorted_unique_heavy_elements
  rule: >-
    Group the 31 eligible candidates by atom-count bin and unique heavy-element
    composition. Sort strata and members by independent SHA256 keys and select
    round-robin until 20 parents are fixed. Within each selected parent, hold
    out the stable direction with the lowest SHA256 key and train on every
    other stable direction. Candidate q59 predictions are forbidden inputs.

