loss:
  formula: >-
    Replay updates use lambda_E*L_E+lambda_G*L_G+lambda_F*L_F. H updates
    use one lambda_H*L_H Rademacher-HVP term computed through the complete
    PySCFAD/JAX plus torch automatic-differentiation graph. Solver residuals contribute no loss samples.
  energy:
    target: structures25_e_kin_plus_xc_label
    evaluation_point: fixed_pbe_ks_label_density
    reduction: absolute_scaled_l1
    absolute_scale_hartree: 0.1
  density:
    canonical_name: gradient
    target: projected_structures25_kin_plus_xc_gradient_label
    evaluation_point: fixed_pbe_ks_label_density
    projection: electron_number_tangent
    reduction: mean_squared_error_over_untransformed_coefficients
    scale_hartree_per_density_coefficient: 1.0e-2
    solver_stationarity_contribution: forbidden
  force:
    target: complete_pbe_relaxed_force
    evaluation_point: strictly_converged_model_self_consistent_density
    parameter_density_response: implicit_required
    reduction: mixed_absolute_relative_l1
    relative_fraction: 0.5
    absolute_scale_hartree_per_bohr: 0.01
    relative_rms_floor_hartree_per_bohr: 1.0e-3
  hvp:
    target: symmetric_complete_pbe_relaxed_hessian
    evaluation_point: strictly_converged_model_self_consistent_density
    input_projection: complete_internal
    output_projection: complete_internal
    reduction: mean_internal_matrix
    stochastic_formula: rademacher_expectation_equals_internal_matrix_frobenius_mse
    absolute_scale_hartree_per_bohr2: 0.1
  low_mode:
    mode_count: 0
    wrong_curvature_multiplier: 2.0
  calibration_probe_weights:
    lambda_E: 0.1
    lambda_G: 0.8
    lambda_F: 1.0
    lambda_H: 0.01
  initial_weights:
    lambda_E: 0.1
    lambda_F: 1.0
    lambda_G: 0.8
    lambda_H: 0.01
    lambda_Q: 0.0
    lambda_spec: 0.0
  legacy_lambda_h_or_calibration_reuse_allowed: false
  formal_lambda_h_source: required_same_protocol_v8_autodiff_calibration_artifact

gradient_calibration:
