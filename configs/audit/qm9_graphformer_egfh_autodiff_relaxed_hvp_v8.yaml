definitions:
  physical_definition_id: qm9_complete_total_relaxed_egfh_v1
  normative_specification: docs/qm9_ofdft_canonical_physical_definitions_v1.md
  scalar_owner: >-
    A_theta(R,c)=E_Graphformer_kin_plus_xc(R,c;theta), and
    E_total_theta(R,c)=A_theta(R,c)+E_H(R,c)+E_ext(R,c)+E_nn(R).
    There is no independent force or Hessian owner.
  structures25_energy: >-
    E supervision is A_theta(R,c_KS) against the Structures25
    of_labels/energies/e_kin_plus_xc label at the common final converged label
    index. It is not a complete-total energy loss.
  structures25_density_gradient: >-
    G supervision is the direct electron-number-tangent projection of
    grad_c A_theta(R,c_KS)-grad_kin_plus_xc_label at that same index, reduced as
    a mean squared error over untransformed density coefficients.
  total_relaxed_force: >-
    F_theta(R)=-d E_total_theta(R,c_theta_star(R))/dR at the strictly converged
    model-self-consistent constrained density, with implicit parameter response.
  complete_total_relaxed_hvp: >-
    H_theta v is the constrained KKT Schur-complement response at the strictly
    converged model-self-consistent density. PySCFAD/JAX supplies nuclear-coordinate
    integral Jacobians and Jacobian-vector products; torch autograd owns the scalar,
    density-response, and model-parameter graph. No numerical displacement is used.
  solver_stationarity: >-
    Density, electron-number, KKT, predictor, and corrector residuals are
    diagnostic-only fail-closed gates and never enter E, G, F, or H losses.
  forbidden_fallbacks:
    - fixed_density_force_or_hvp
    - displaced_ks_density_hvp
    - stale_model_density
    - detached_force_or_hvp
    - independent_force_head
    - independent_hessian_head
    - stationarity_residual_as_g_label
    - legacy_capacity_optimizer_resume
    - numerical_integral_derivative_primary_path
    - relaxed_force_finite_difference_training_target
    - finite_difference_hessian_model_selection

