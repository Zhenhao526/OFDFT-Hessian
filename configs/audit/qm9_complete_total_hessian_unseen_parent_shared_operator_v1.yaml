evaluation:
  definition: >-
    Apply only the frozen chemistry-conditioned spectral and equivariant atom-block
    operator coefficients to unseen parents. The reference-anchored scalar quadratic
    preserves source energy and force at R0 and supplies the Hessian correction.
  exact_parent_hvp_interpolant_allowed: false
  per_parent_fitting_allowed: false
  validation_hvp_labels_allowed: false
  polynomial_degree: 5
  rbf_centers: [-0.25, 0.0, 0.25, 0.5, 1.0, 2.0, 3.0, 4.5]
  rbf_width: 0.5
  parent_feature_normalization: frozen_from_stage2_candidate

gates:
  hessian_median_relative_frobenius_max: 0.10
  hessian_fraction_at_or_below_0_15_min: 0.80
  hessian_p90_relative_frobenius_max: 0.20
  asym_over_sym_frobenius_max: 0.005
  energy_median_regression_max_fraction: 0.05
  energy_p90_regression_max_fraction: 0.05
  force_median_regression_max_fraction: 0.05
  force_p90_regression_max_fraction: 0.05
  energy_force_change_from_h512_source: exactly_zero_by_anchor
  decision: >-
    Rank the two frozen arms by the full Hessian distribution gate, then require
    source E/F to satisfy the replay regression gate. Passing both permits preparation
    of train100 HVP plus train800 E/F replay. Failure keeps Test100 frozen and returns
    to transferable operator design.
