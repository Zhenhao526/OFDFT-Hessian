protocol_id: qm9_complete_total_hessian_capacity_v1_stable5_v2
frozen_at: 2026-07-20
supersedes: qm9_complete_total_hessian_capacity_v1_stable5
test100_access_allowed: false
test100_evaluations_used: 0

definitions:
  scalar_owner: >-
    E_total(R,c;theta) = E_model_kin_plus_xc(R,c;theta) + E_H(R,c)
    + E_ext(R,c) + E_nn(R)
  total_relaxed_force: F = -d E_total(R,c_star(R;theta);theta) / dR
  complete_total_relaxed_hvp: >-
    H v = -(F(R+h v,c_star(R+h v))-F(R-h v,c_star(R-h v)))/(2 h)
  independent_force_head_allowed: false

data:
  source_dataset: QM9PBEForceRandom1000
  source_split_sha256: 8d5fc057a0ff6af2f7d994db7f6517145c00c745416b015caa3dd9afb57f1c7a
  sample_id: 0
  pbe_reference: analytic_PBE_energy_force_hessian
  parent_grouping_required: true
  numerical_stability_gate: >-
    Before model fitting require ||H_asym,baseline||F / ||H_PBE||F < 0.005. This avoids a large
    baseline curl being hidden by an inaccurate oversized symmetric baseline Hessian.
  numerical_exclusions:
    - {molecule_id: "0050129", baseline_asym_over_pbe: 0.0367777179}
    - {molecule_id: "0033410", baseline_asym_over_pbe: 0.0386765866}
  replacement_rule: >-
    Continue the pre-existing all-four-direction stable train100 ordering after excluding parents
    that fail the PBE-normalized curl gate. The only remaining pre-audited candidate is 0121249.
  stage1_parents:
    - {molecule_id: "0028399", natoms: 15, reason: pbe_normalized_curl_stable}
    - {molecule_id: "0031108", natoms: 16, reason: pbe_normalized_curl_stable}
    - {molecule_id: "0132419", natoms: 16, reason: pbe_normalized_curl_stable}
    - {molecule_id: "0031012", natoms: 18, reason: pbe_normalized_curl_stable}
    - {molecule_id: "0121249", natoms: 21, reason: final_existing_all4_stable_candidate}
  stage1_role: capacity_only_not_validation
  validation_parents_consumed_by_stage1: 0

loss:
  low_mode: {mode_count: 6, wrong_curvature_multiplier: 2.0}
  initial_weights:
    lambda_E: 1.0
    lambda_F: 1.0
    lambda_rho: 0.1
    lambda_H: 1.0
    lambda_Q: 0.0
    lambda_spec: 0.1

stage1:
  gate:
    training_median_relative_frobenius_max: 0.05
    training_all_parent_relative_frobenius_max: 0.05
    preferred_relative_frobenius_max: 0.01
    energy_abs_error_median_max_hartree: 1.0e-3
    energy_abs_error_all_parent_max_hartree: 2.0e-3
    force_mae_median_max_hartree_per_bohr: 1.0e-3
    force_mae_all_parent_max_hartree_per_bohr: 3.0e-3
    strict_density_convergence_rate_min: 1.0
    antisymmetric_over_symmetric_fro_max: 0.005

formal_targets:
  median_relative_frobenius_max: 0.10
  molecule_fraction_below_0p15_min: 0.80
  p90_relative_frobenius_max: 0.20
  frequency_mae_cm1: [100, 200]
  antisymmetric_over_symmetric_fro_max: 0.005
  energy_force_must_not_significantly_degrade: true
