definitions:
  physical_definition_id: qm9_complete_total_relaxed_egfh_v1
  normative_specification: docs/qm9_ofdft_canonical_physical_definitions_v1.md
  scalar_owner: >-
    A_theta(R,c)=E_Graphformer_kin_plus_xc(R,c;theta), and
    E_total_theta(R,c)=A_theta(R,c)+E_H(R,c)+E_ext(R,c)+E_nn(R).
    Energy, gradient, relaxed force, and relaxed Hessian all derive from this
    single scalar. Independent force and Hessian heads are forbidden.
  energy_gradient_branch: structures25_kin_plus_xc_at_fixed_pbe_ks_density
  force_hessian_branch: model_self_consistent_complete_total_relaxed_pes
  forbidden_fallbacks:
    - independent_force_head
    - independent_hessian_head
    - fixed_density_force_or_hvp
    - detached_force_or_hvp
    - finite_difference_training_target
    - numerical_hessian_model_selection
    - amp_fp16_bf16
    - tf32
    - torch_compile_before_high_order_consistency_gate

