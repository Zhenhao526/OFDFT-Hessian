  require_checkpoint_byte_identity_before_after_hessian: true
  require_all_finite: true
  hessian_symmetry_max_abs: 1.0e-10

distributed:
  launcher: torchrun --standalone --nproc_per_node=8
  process_group_backend: nccl
  world_size: 8
  rank_device_binding: cuda:${LOCAL_RANK}
  model_parallelism: torch.nn.parallel.DistributedDataParallel
  data_parallelism: one_distinct_train_molecule_per_rank_per_global_update
  gradient_aggregation: explicit_float64_sum_all_reduce_then_divide_by_8
  global_loss_reduction: mean_over_8_distinct_molecules
  train_molecules_per_epoch: 80
  global_updates_per_epoch: 10
  local_molecules_per_rank_per_epoch: 10
  batch_schedule: deterministic_size_balanced_10x8
  checkpoint_writer: rank0_atomic_only
  checkpoint_required_state:
    - model
    - fresh_adamw_optimizer
    - global_step
    - epoch
    - per_rank_torch_cpu_rng
    - per_rank_torch_cuda_rng
    - per_rank_numpy_rng
    - per_rank_python_rng
    - sampler_state
    - hvp_direction_sequence_state
    - per_molecule_density_predictor_state

numerics:
  dtype: float64
  amp_enabled: false
  tf32_enabled: false
  integral_derivative_backend: torch_autograd_dqc
  integral_derivative_step_bohr: 0.0
  integral_directional_second_step_bohr: 0.0
  dqc_git_commit: 0fe821fc92cb3457fb14f6dff0c223641c514ddb
  dqclibs_version: 0.1.1
  dqclibs_wheel_sha256: 912a0103f2157a89a1117f8b2a432a9fd32ceb020e1cdcb89948ae4fac2da083
  torch_version: 2.4.1
  symmetric_matrix_power_mode: eigh_second_order_audit
  density_solver_target: 5.0e-9
  training_density_stationarity_max: 1.0e-8
  center_electron_number_residual_max: 1.0e-10
  analytic_response_residual_max: 1.0e-8
  analytic_response_constraint_residual_max: 1.0e-10

loss:
  reduction: per_molecule_then_global_mean
  lambda_E: 0.1
  lambda_G: 0.8
  lambda_F: 1.0
  lambda_H: null
  lambda_H_source: required_same_v11_train80_ddp8_calibration_artifact
  hessian_training_direction:
    count_per_rank_per_update: 1
    distribution: internal_space_rademacher
    resample_each_use: true
    estimator: unbiased_internal_projected_hessian_frobenius_squared
  gradient_calibration:
    population: Train80_only
    initialization: released_article_checkpoint
    learning_rate: 0.0
    aggregate: global_mean_over_all_80_molecules_and_registered_directions
    record_per_molecule_norms: true
    target_weighted_h_to_egf_gradient_ratio: 0.25
    lambda_h_min: 1.0e-4
    lambda_h_max: 1.0

ddp_consistency_gate:
  required_before_any_nonzero_lr_update: true
  population: same_fixed_8_train_molecules_and_same_8_hvp_directions
  compare:
    - raw_component_losses
    - weighted_component_losses
    - per_parameter_e_gradient
    - per_parameter_g_gradient
    - per_parameter_f_gradient
    - per_parameter_h_gradient
    - aggregate_gradient
    - one_adamw_parameter_update
  tolerance:
    scalar_atol: 1.0e-11
    scalar_rtol: 1.0e-10
    gradient_max_abs: 1.0e-10
    gradient_relative_l2: 1.0e-9
    update_max_abs: 1.0e-11
    update_relative_l2: 1.0e-10
  failure_action: stop_without_training

learning_rate_pilots:
  candidates: [3.0e-7, 1.0e-6, 3.0e-6]
  preferred_first: 1.0e-6
  initialization_reset_for_each_candidate: true
  optimizer_reset_for_each_candidate: true
  train_population: Train80
  validation_population: Validation10
  global_updates: 20
  epochs: 2
  identical_global_batches_and_hvp_directions: true
  selection: highest_learning_rate_passing_all_gates_then_lowest_validation_composite
  gates:
    all_finite: true
    density_and_kkt_pass_rate: 1.0
    analytic_response_pass_rate: 1.0
    gradient_clip_fraction_max: 0.20
    sustained_explosion_window_updates: 5
    sustained_explosion_multiplier_vs_initial_median: 5.0
    validation_energy_force_hessian_finite: true
  test_access_allowed: false

formal_training:
  learning_rate: null
  learning_rate_source: required_frozen_pilot_selection_artifact
  lambda_H: null
  lambda_H_source: required_frozen_v11_calibration_artifact
  optimizer: AdamW
  fresh_optimizer_state: true
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  gradient_clip_norm: 1.0
  validation_interval_epochs: 1
  checkpoint_interval_global_updates: 10
  full_hessian_validation: true
  minimum_validation_intervals_before_stop: 4
  stop_requires_consecutive_intervals: 3
  validation_composite: >-
    mean over molecules of the equally weighted normalized Energy absolute
    error, Force MAE, Hessian MAE, and Hessian relative Frobenius error, with
    normalization constants frozen from Train80 before pilot selection.
  platform_or_improvement_rule: >-
    Each qualifying interval must either improve the validation composite by
    at least 0.5 percent relative to the best earlier interval, or have absolute
    relative change no greater than 1 percent while Force MAE and Hessian
    relative Frobenius do not regress by more than 1 percent. Three consecutive
    qualifying intervals are required.
  model_selection: lowest_validation_composite_among_eligible_checkpoints
  test_access_allowed: false

evaluation:
  validation_parallelism: molecule_and_internal_basis_direction_sharded_over_8_gpus
  metrics:
    - energy_absolute_error
    - force_mae
    - hessian_mae
    - hessian_relative_frobenius
    - hessian_symmetry_max_abs
    - density_projected_gradient_residual
    - kkt_residual
  aggregate_statistics: [mean, median, p90]
  final_test_once: true
  retraining_after_test_forbidden: true

performance_audit:
  same_global_batch_and_numerical_definition: true
  warmup_global_updates: 2
  measured_global_updates: 20
  configurations: [one_gpu_serial_8_molecules, eight_gpu_ddp_8_molecules]
  target_end_to_end_speedup: 4.0
  report:
    - end_to_end_step_time
    - hvp_backward_time
    - density_response_time
    - integral_derivative_time
    - communication_time
    - full_hessian_evaluation_time
    - gpu_utilization
    - peak_gpu_memory
  below_target_action: report_bottleneck_without_claiming_success
